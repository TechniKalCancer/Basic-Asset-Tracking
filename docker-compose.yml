services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asset_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-asset_tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asset_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asset_tracker}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-asset_tracker}
    volumes:
      # Drop a Google service account JSON key here and point
      # GOOGLE_SERVICE_ACCOUNT_FILE at /app/instance/google-credentials/<file>
      # — see /admin/google_setup for the guided walkthrough. Read-only, and
      # the local google-credentials/ folder is gitignored — never commit a
      # real key.
      - ./google-credentials:/app/instance/google-credentials:ro
      # Uploaded logos from /admin/branding — a plain named volume (not a
      # host folder) since these are managed entirely through the UI, not
      # dropped in by hand like the google-credentials key above.
      - branding-data:/app/instance/branding
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  branding-data:
