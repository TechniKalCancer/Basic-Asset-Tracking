{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div style="max-width:360px;margin:4rem auto;">
  <div class="card">
    {% if branding.logo_url %}
    <img src="{{ branding.logo_url }}" alt="{{ branding.app_name or 'Logo' }}" style="display:block;max-height:80px;max-width:100%;margin:0 auto 1rem;">
    {% endif %}
    <h1 style="text-align:center;margin-bottom:1.5rem;">🔒 Admin Login</h1>
    <form method="POST" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:.4rem;">Username (leave blank for the shared admin password)</label>
      <input type="text" name="username" autofocus placeholder="e.g. jsmith"
             style="margin-bottom:1rem;" autocomplete="username" />
      <label style="display:block;font-size:.85rem;color:var(--muted);margin-bottom:.4rem;">Password</label>
      <input type="password" name="password" placeholder="Enter password"
             style="margin-bottom:1rem;" autocomplete="current-password" />
      <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
    </form>
    <p style="margin-top:1rem;font-size:.78rem;color:var(--muted);text-align:center;">
      Locked out after 5 failed attempts for 5 minutes.
    </p>
  </div>
</div>
{% endblock %}
