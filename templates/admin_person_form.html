{% extends 'base.html' %}
{% block title %}{{ 'Edit Person' if person else 'Add Person' }}{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
  <h1 style="margin:0;">{{ 'Edit Person' if person else 'Add Person' }}</h1>
  <span class="spacer" style="flex:1;"></span>
  <a href="/admin/people" class="btn btn-ghost">← Back</a>
</div>

{% set values = form or person %}
<div class="card" style="max-width:480px;">
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">First Name</label>
      <input name="first_name" value="{{ values.first_name if values else '' }}" required />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Last Name</label>
      <input name="last_name" value="{{ values.last_name if values else '' }}" required />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Email</label>
      <input type="email" name="email" value="{{ values.email if values else '' }}" required />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Role</label>
      <select name="role">
        <option value="staff"   {{ 'selected' if values and values.role == 'staff' }}>Staff</option>
        <option value="student" {{ 'selected' if values and values.role == 'student' }}>Student</option>
      </select>
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Department (optional)</label>
      <input name="department" value="{{ (values.department or '') if values else '' }}" />
    </div>
    <div style="margin-bottom:1.5rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Site (optional)</label>
      <input name="site" value="{{ (values.site or '') if values else '' }}" placeholder="e.g. North Elementary" />
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if person else 'Add Person' }}</button>
  </form>
</div>
{% endblock %}
