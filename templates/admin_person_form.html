{% extends 'base.html' %}
{% block title %}{{ 'Edit Person' if person else 'Add Person' }}{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
  <h1 style="margin:0;">{{ 'Edit Person' if person else 'Add Person' }}</h1>
  <span class="spacer" style="flex:1;"></span>
  <a href="/admin/people" class="btn btn-ghost">← Back</a>
</div>

{% set values = form or person %}
<div class="card" style="max-width:480px;">
  <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">First Name</label>
      <input name="first_name" value="{{ values.first_name if values else '' }}" required />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Last Name</label>
      <input name="last_name" value="{{ values.last_name if values else '' }}" required />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Email</label>
      <input type="email" name="email" value="{{ values.email if values else '' }}" required />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">ID Number (optional)</label>
      <input name="external_id" value="{{ (values.external_id or '') if values else '' }}" placeholder="District staff/student ID" />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Role</label>
      <select name="role">
        <option value="staff"   {{ 'selected' if values and values.role == 'staff' }}>Staff</option>
        <option value="student" {{ 'selected' if values and values.role == 'student' }}>Student</option>
      </select>
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Department (optional)</label>
      <input name="department" value="{{ (values.department or '') if values else '' }}" />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Site</label>
      <select name="site_id" required>
        <option value="">Choose a site…</option>
        {% for site in sites %}
        <option value="{{ site.id }}" {{ 'selected' if values and values.site_id == site.id }}>{{ site.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div style="margin-bottom:1.5rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Graduation Year (optional, students)</label>
      <input type="number" name="grad_year" value="{{ (values.grad_year or '') if values else '' }}" placeholder="e.g. 2031" />
    </div>
    <label style="display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem;font-size:.85rem;color:var(--muted);cursor:pointer;">
      <input type="checkbox" name="insurance_opted_in" style="width:auto;" {{ 'checked' if values and values.insurance_opted_in }} />
      Family opted into the device protection plan
    </label>
    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if person else 'Add Person' }}</button>
  </form>
</div>
{% endblock %}
