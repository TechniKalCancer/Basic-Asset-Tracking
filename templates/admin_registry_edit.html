{% extends 'base.html' %}
{% block title %}Edit {{ registry_row.asset_tag }}{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
  <h1 style="margin:0;">✏️ Edit <code>{{ registry_row.asset_tag }}</code></h1>
  <span class="spacer" style="flex:1;"></span>
  <a href="/admin/registry" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:480px;">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Asset Tag</label>
      <input value="{{ registry_row.asset_tag }}" disabled style="opacity:.6;" />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Serial Number</label>
      <input name="serial_number" value="{{ registry_row.serial_number or '' }}" required />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Description (optional)</label>
      <input name="description" value="{{ registry_row.description or '' }}" placeholder="e.g. Dell Latitude 5420" />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Device Type</label>
      <select name="device_type">
        {% for t in device_types %}
          <option value="{{ t }}" {{ 'selected' if registry_row.device_type == t }}>{{ t|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Model (optional)</label>
      <select name="device_model_id">
        <option value="">— None / custom —</option>
        {% for m in device_models %}
        <option value="{{ m.id }}" {{ 'selected' if registry_row.device_model_id == m.id }}>{{ m.full_name }} ({{ m.device_type }})</option>
        {% endfor %}
      </select>
      <span style="display:block;margin-top:.3rem;font-size:.78rem;color:var(--muted);">
        <a href="/admin/device_models/new">+ Add a new model</a> to the catalog first if it's not listed.
      </span>
    </div>
    <div style="margin-bottom:1.5rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Site</label>
      <select name="site_id" required>
        <option value="">Choose a site…</option>
        {% for site in sites %}
        <option value="{{ site.id }}" {{ 'selected' if registry_row.site_id == site.id }}>{{ site.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Purchase Date (optional)</label>
      <input type="date" name="purchase_date" value="{{ registry_row.purchase_date.strftime('%Y-%m-%d') if registry_row.purchase_date else '' }}" />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Purchase Cost (optional)</label>
      <input name="purchase_cost" value="{{ registry_row.purchase_cost if registry_row.purchase_cost is not none else '' }}" placeholder="e.g. 329.99" />
    </div>
    <div style="margin-bottom:1.5rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Warranty Expiration (optional)</label>
      <input type="date" name="warranty_expiration" value="{{ registry_row.warranty_expiration.strftime('%Y-%m-%d') if registry_row.warranty_expiration else '' }}" />
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
  </form>
</div>
{% endblock %}
