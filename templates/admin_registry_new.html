{% extends 'base.html' %}
{% block title %}Add Device{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
  <h1 style="margin:0;">➕ Add Device</h1>
  <span class="spacer" style="flex:1;"></span>
  <a href="/admin/registry" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:480px;">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">
        Asset Tag <span style="font-weight:400;">(optional — leave blank to self-assign a random 6-digit tag)</span>
      </label>
      <input name="asset_tag" value="{{ form.asset_tag if form else '' }}" placeholder="e.g. 483920" />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Serial Number (optional)</label>
      <input name="serial_number" value="{{ form.serial_number if form else '' }}" />
    </div>
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Description (optional)</label>
      <input name="description" value="{{ form.description if form else '' }}" placeholder="e.g. Dell Latitude 5420" />
    </div>
    <div style="margin-bottom:1.5rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Device Type</label>
      <select name="device_type">
        {% for t in device_types %}
          <option value="{{ t }}" {{ 'selected' if form and form.device_type == t }}>{{ t|capitalize }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Add Device</button>
  </form>
</div>
{% endblock %}
