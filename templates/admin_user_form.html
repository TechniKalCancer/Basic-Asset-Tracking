{% extends 'base.html' %}
{% block title %}{{ 'Edit User' if user else 'Add User' }}{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
  <h1 style="margin:0;">{{ 'Edit User' if user else 'Add User' }}</h1>
  <span class="spacer" style="flex:1;"></span>
  <a href="/admin/users" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:480px;">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    {% if not user %}
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">Username</label>
      <input name="username" required />
    </div>
    {% endif %}

    <div style="margin-bottom:1.5rem;">
      <label style="display:block;margin-bottom:.3rem;color:var(--muted);font-size:.85rem;">
        {{ 'New Password (leave blank to keep current)' if user else 'Password' }}
      </label>
      <input type="password" name="password" autocomplete="new-password" {{ 'required' if not user }} />
    </div>

    <label style="display:block;margin-bottom:.6rem;color:var(--muted);font-size:.85rem;">Permissions</label>
    <div style="display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.5rem;">
      <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
        <input type="checkbox" name="is_admin" style="width:auto;" {{ 'checked' if user and user.is_admin }} />
        Admin (full access, incl. managing users)
      </label>
      <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
        <input type="checkbox" name="can_people" style="width:auto;" {{ 'checked' if user and user.can_people }} />
        People
      </label>
      <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
        <input type="checkbox" name="can_devices" style="width:auto;" {{ 'checked' if user and user.can_devices }} />
        Devices / Asset Registry
      </label>
      <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
        <input type="checkbox" name="can_loaners" style="width:auto;" {{ 'checked' if user and user.can_loaners }} />
        Loaners
      </label>
      <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
        <input type="checkbox" name="can_repairs" style="width:auto;" {{ 'checked' if user and user.can_repairs }} />
        Repairs
      </label>
    </div>

    {% if user %}
    <label style="display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem;cursor:pointer;">
      <input type="checkbox" name="is_active" style="width:auto;" {{ 'checked' if user.is_active }} />
      Active (unchecking disables login without deleting the account)
    </label>
    {% endif %}

    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if user else 'Add User' }}</button>
  </form>
</div>
{% endblock %}
