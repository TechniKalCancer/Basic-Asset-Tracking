{% extends 'base.html' %}
{% block title %}{{ module.label }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:2rem auto;text-align:center;">
  <h1 style="margin-bottom:.6rem;">{{ reason }}</h1>
  <p style="color:var(--muted);margin-bottom:1.2rem;">{{ module.desc }}</p>
  {% if can_change %}
  <a href="/admin/features#{{ module_key }}" class="btn btn-primary">Open Settings → Features</a>
  {% else %}
  <p style="color:var(--muted);font-size:.9rem;">Ask your FoxDesk administrator if you need it.</p>
  {% endif %}
</div>
{% endblock %}
